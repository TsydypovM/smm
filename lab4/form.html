<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.jpg" alt="Логотип студии дизайна интерьера" width="150">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="form.html">Форма обратной связи</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Оформить заказ на дизайн-проект</h1>
            
            <form id="orderForm">
                <!-- ФИО -->
                <div>
                    <label for="fio">ФИО заявителя:</label>
                    <div class="form-content">
                        <input type="text" id="fio" name="fio">
                    </div>
                </div>
                
                <!-- Адрес -->
                <div>
                    <label for="address">Адрес объекта:</label>
                    <div class="form-content">
                        <input type="text" id="address" name="address">
                    </div>
                </div>
                
                <!-- Телефон -->
                <div>
                    <label for="phone">Телефон:</label>
                    <div class="form-content">
                        <input type="text" id="phone" name="phone" placeholder="+7(XXX)XXX-XX-XX">
                    </div>
                </div>
                
                <!-- Email -->
                <div>
                    <label for="email">Адрес электронной почты:</label>
                    <div class="form-content">
                        <input type="text" id="email" name="email">
                    </div>
                </div>

                <!-- Цветовая гамма (матрица 2x2) -->
                <div>
                    <p>Цветовая гамма:</p>
                    <div class="form-content">
                        <div class="checkbox-grid">
                            <label>
                                <input type="checkbox" name="color" value="Светлая"> Светлая
                            </label>
                            <label>
                                <input type="checkbox" name="color" value="Темная"> Темная
                            </label>
                            <label>
                                <input type="checkbox" name="color" value="Натуральная"> Натуральная
                            </label>
                            <label>
                                <input type="checkbox" name="color" value="Яркая"> Яркая
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Стиль интерьера -->
                <div>
                    <p>Стиль интерьера:</p>
                    <div class="form-content">
                        <div class="radio-grid">
                            <label>
                                <input type="radio" name="style" value="Классический"> Классический
                            </label>
                            <label>
                                <input type="radio" name="style" value="Скандинавский"> Скандинавский
                            </label>
                            <label>
                                <input type="radio" name="style" value="Минимализм"> Минимализм
                            </label>
                            <label>
                                <input type="radio" name="style" value="Лофт"> Лофт
                            </label>
                            <label>
                                <input type="radio" name="style" value="Арт-деко"> Арт-деко
                            </label>
                            <label>
                                <input type="radio" name="style" value="Этнический"> Этнический
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Форма взаимодействия (выпадающий список) -->
                <div>
                    <label for="contact">Форма взаимодействия:</label>
                    <div class="form-content">
                        <select id="contact" name="contact">
                            <option value="По почте">По почте</option>
                            <option value="По телефону">По телефону</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>
                </div>

                <!-- Комментарий к дизайнеру -->
                <div>
                    <label for="comment">Комментарий к дизайнеру:</label>
                    <div class="form-content">
                        <textarea id="comment" name="comment" rows="5" cols="40" wrap="soft"></textarea>
                    </div>
                </div>

                <!-- Кнопки -->
                <div>
                    <div class="button-group">
                        <input type="submit" value="Оформить заказ">
                        <input type="reset" value="Очистить форму">
                    </div>
                </div>
            </form>

            <!-- Контейнер для карточек заказов -->
            <h2>Ваши заказы</h2>
            <div id="ordersContainer" class="orders-container"></div>
        </section>
    </main>

    <footer>
        <a href="https://miet.ru/" target="_blank">
            <img src="images/miet-logo.png" alt="Логотип НИУ МИЭТ" width="100">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О НАС</a></li>
                <li><a href="form.html">ФОРМА ОБРАТНОЙ СВЯЗИ</a></li>
            </ul>
        </nav>
    </footer>

    <script>
        // Получаем форму и контейнер для карточек
        const form = document.getElementById('orderForm');
        const ordersContainer = document.getElementById('ordersContainer');

        // Функция проверки телефона (формат: +7(XXX)XXX-XX-XX)
        function validatePhone(phone) {
            const phoneRegex = /^\+7\(\d{3}\)\d{3}-\d{2}-\d{2}$/;
            return phoneRegex.test(phone);
        }

        // Функция проверки email
        function validateEmail(email) {
            return email.includes('@') && email.includes('.');
        }

        // Функция проверки всех полей формы
        function validateForm(fio, address, phone, email) {
            if (!fio.trim()) {
                alert('Не введено ФИО!');
                return false;
            }
            if (!address.trim()) {
                alert('Не введён адрес объекта!');
                return false;
            }
            if (!phone.trim()) {
                alert('Не введён номер телефона!');
                return false;
            }
            if (!validatePhone(phone)) {
                alert('Телефон должен быть в формате +7(XXX)XXX-XX-XX\nПример: +7(999)123-45-67');
                return false;
            }
            if (!email.trim()) {
                alert('Не введён адрес электронной почты!');
                return false;
            }
            if (!validateEmail(email)) {
                alert('Email должен содержать символы "@" и "."\nПример: user@example.com');
                return false;
            }
            return true;
        }

        // Функция получения выбранных цветов
        function getSelectedColors() {
            const colorCheckboxes = document.querySelectorAll('input[name="color"]:checked');
            const colors = [];
            colorCheckboxes.forEach(checkbox => {
                colors.push(checkbox.value);
            });
            return colors;
        }

        // Функция получения выбранного стиля
        function getSelectedStyle() {
            const selectedRadio = document.querySelector('input[name="style"]:checked');
            return selectedRadio ? selectedRadio.value : 'Не выбран';
        }

        // Функция создания карточки заказа
        function createOrderCard(orderData) {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            // Формируем HTML карточки
            card.innerHTML = `
                <div class="card-header">
                    <h3>Заказ от ${new Date().toLocaleString()}</h3>
                    <button class="delete-btn" onclick="this.parentElement.parentElement.remove()">✖</button>
                </div>
                <div class="card-content">
                    <p><strong>ФИО:</strong> ${escapeHtml(orderData.fio)}</p>
                    <p><strong>Адрес:</strong> ${escapeHtml(orderData.address)}</p>
                    <p><strong>Телефон:</strong> ${escapeHtml(orderData.phone)}</p>
                    <p><strong>Email:</strong> ${escapeHtml(orderData.email)}</p>
                    <p><strong>Цветовая гамма:</strong> ${orderData.colors.length > 0 ? orderData.colors.join(', ') : 'Не выбрана'}</p>
                    <p><strong>Стиль интерьера:</strong> ${orderData.style}</p>
                    <p><strong>Форма взаимодействия:</strong> ${orderData.contact}</p>
                    <p><strong>Комментарий:</strong> ${escapeHtml(orderData.comment) || 'Нет комментария'}</p>
                </div>
            `;
            
            return card;
        }

        // Простая защита от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Обработчик отправки формы
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Отменяем перезагрузку страницы
            
            // Получаем значения полей
            const fio = document.getElementById('fio').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const contact = document.getElementById('contact').value;
            const comment = document.getElementById('comment').value;
            const colors = getSelectedColors();
            const style = getSelectedStyle();
            
            // Валидация
            if (!validateForm(fio, address, phone, email)) {
                return;
            }
            
            // Создаём объект с данными заказа
            const orderData = {
                fio: fio,
                address: address,
                phone: phone,
                email: email,
                colors: colors,
                style: style,
                contact: contact,
                comment: comment
            };
            
            // Создаём карточку и добавляем в контейнер
            const card = createOrderCard(orderData);
            ordersContainer.prepend(card); // Новый заказ сверху
            
            // Очищаем форму
            form.reset();
            
            // Показываем сообщение об успехе
            alert('Заказ успешно оформлен!');
        });
    </script>
</body>
</html>
