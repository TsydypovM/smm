    <main>
        <section>
            <h1>Стили интерьера</h1>
            <p>Мы собрали для вас 6 основных стилей дизайна интерьера с их разновидностями. Нажмите на карточку, чтобы узнать подробнее.</p>
        </section>

        <section>
            <figure>
                <a href="classic.html">
                    <img src="images/classic-card.jpg" alt="Классический стиль интерьера" width="300">
                    <figcaption>
                        <h3>Классический стиль</h3>
                        <p>База, которая никогда не выходит из моды. Симметрия, благородные пропорции, натуральные материалы и элегантность.</p>
                    </figcaption>
                </a>
            </figure>

            <figure>
                <a href="scandi.html">
                    <img src="images/scandi-card.jpg" alt="Скандинавский стиль интерьера" width="300">
                    <figcaption>
                        <h3>Скандинавский стиль</h3>
                        <p>Эталон простоты и функциональности. Светлое и уютное пространство с натуральными материалами.</p>
                    </figcaption>
                </a>
            </figure>

            <figure>
                <a href="minimalism.html">
                    <img src="images/minimalism-card.png" alt="Минимализм в интерьере" width="300">
                    <figcaption>
                        <h3>Минимализм</h3>
                        <p>Философия «меньше значит больше». Максимальная функциональность и идеально ровные поверхности.</p>
                    </figcaption>
                </a>
            </figure>

            <figure>
                <a href="loft.html">
                    <img src="images/loft-card.jpg" alt="Лофт интерьер" width="300">
                    <figcaption>
                        <h3>Лофт</h3>
                        <p>Контраст грубой отделки и современного комфорта. Открытая планировка, кирпичные стены, коммуникации на виду.</p>
                    </figcaption>
                </a>
            </figure>

            <figure>
                <a href="artdeco.html">
                    <img src="images/artdeco-card.jpg" alt="Арт-деко интерьер" width="300">
                    <figcaption>
                        <h3>Арт-деко</h3>
                        <p>Роскошь и гламур 1920-30-х годов. Геометрические формы, дорогие материалы, зеркала-солнца.</p>
                    </figcaption>
                </a>
            </figure>

            <figure>
                <a href="ethnic.html">
                    <img src="images/ethnic-card.jpg" alt="Этнический стиль интерьера" width="300">
                    <figcaption>
                        <h3>Этнические стили</h3>
                        <p>Интерьеры, вдохновленные культурой и природой разных уголков мира. Неповторимый колорит и настроение.</p>
                    </figcaption>
                </a>
            </figure>
